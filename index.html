<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutwine — Let's Mingle | Find Real Connections Near You</title>
    <meta name="description" content="Tutwine is the modern dating app that connects you with real, verified people nearby. Smart matching, real-time chat, 18+ only. Join 50,000+ singles free." />
    <meta name="keywords" content="dating app, online dating, find matches, meet people near me, safe dating, verified profiles, real connections" />
    <meta name="author" content="Tutwine" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tutwine.app/" />
    <link rel="icon" href="/logo.jpeg" type="image/jpeg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Tutwine — Let's Mingle | Find Real Connections Near You" />
    <meta property="og:description" content="Smart matching, verified profiles, real-time chat. Join 50,000+ singles finding genuine connections. Free to start." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tutwine.app/" />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:site_name" content="Tutwine" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tutwine — Let's Mingle | Find Real Connections Near You" />
    <meta name="twitter:description" content="Smart matching, verified profiles, real-time chat. Join 50,000+ singles. Free to start." />
    <meta name="twitter:image" content="/logo.jpeg" />

    <!-- Structured Data: WebSite + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Tutwine",
      "url": "https://tutwine.app/",
      "description": "Modern dating app with smart matching, verified profiles, and real-time chat.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://tutwine.app/discover?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Tutwine",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "12400"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
