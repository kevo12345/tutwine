name: Docker build check

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate docker-compose configuration
        run: docker compose config --quiet

      - name: Check required deployment files
        run: |
          for f in Dockerfile docker-compose.yml nginx.conf .env.example; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Validate nginx config
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Build Docker image
        run: docker compose build

      - name: Smoke test container
        run: |
          docker compose up -d
          for i in $(seq 1 20); do
            curl -fsS http://localhost:80/ >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:80/ | grep -qi "<html"
          curl -fsS -o /dev/null http://localhost:80/some/deep/route
          docker compose down
